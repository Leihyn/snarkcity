[package]
name = "snark_claim"
version = "0.1.0"
description = "SnarkCity claim program: pays sealed-auction allocations against a Merkle root"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "snark_claim"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
test-sbf = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
solana-sha256-hasher = "2.3"

[dev-dependencies]
mollusk-svm = "~0.4"
mollusk-svm-programs-token = "~0.4"
spl-token = { version = "8", features = ["no-entrypoint"] }
solana-program-pack = "2"
solana-account = "2"
serde_json = "1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
